name: Actualizar precios diarios de Matamoros (CRE)

on:
  schedule:
    # 6:00 AM hora estándar de Matamoros (UTC-6 -> 12:00 UTC)
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  sync-prices:
    name: Sincronizar estaciones y precios CRE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Ejecutar sincronización de precios de Matamoros
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync-prices
